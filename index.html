<!doctype html>
<html lang="en">  
<head>  
<meta charset="utf-8">  
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">  
<meta name="theme-color" content="#090d18">  
<title>Educational TV</title>  
<link rel="preconnect" href="https://fonts.googleapis.com">  
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">  
<style>  
:root{  
  --bg:#090d18;  
  --panel:#111a2b;  
  --line:rgba(255,255,255,.12);  
  --text:#f4f7ff;  
  --muted:#9ba9c1;  
  --accent:#65b8ff;  
  --radius:16px  
}  
*{box-sizing:border-box}  
html,body{  
  margin:0;padding:0;width:100%;height:100%;  
  background:var(--bg);color:var(--text);  
  font-family:Inter,Arial,sans-serif;
  overflow:hidden;
}  
body{  
  background:  
    radial-gradient(ellipse at 12% 0%,rgba(56,115,190,.2),transparent 42%),  
    radial-gradient(ellipse at 95% 90%,rgba(112,80,190,.14),transparent 38%),  
    var(--bg);  
}  
button{font:inherit;color:inherit}  

/* TV Navigation Focus Ring */
button:focus, .card.focused, .tv-focused {  
  outline:4px solid #65b8ff !important;  
  outline-offset:3px !important;
  box-shadow:0 0 20px rgba(101,184,255,0.6) !important;
  transform:scale(1.03);
}  

.app{  
  width:100%;height:100vh;
  padding:24px 40px;
  overflow-y:auto;
}  
.topbar{  
  display:flex;align-items:center;justify-content:space-between;  
  margin-bottom:24px  
}  
.brand{display:flex;align-items:center;gap:14px}  
.logo{  
  width:44px;height:44px;border-radius:12px;  
  display:grid;place-items:center;  
  background:linear-gradient(135deg,#238bdc,#7566ed);  
}  
.logo svg{width:22px;height:22px}  
.brand-name{font-size:20px;font-weight:800}  
.brand-sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}  
.refresh{  
  border:1px solid var(--line);background:#ffffff15;  
  color:var(--text);padding:10px 18px;border-radius:999px;font-size:13px;cursor:pointer;
}  

.hero{margin-bottom:20px}  
.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}  
h1{font-size:36px;margin:6px 0 0;font-weight:800;line-height:1.1}  

.browse-bar{display:none;align-items:center;gap:16px;margin:10px 0 20px}  
.browse-bar.visible{display:flex}  
.back-library{  
  border:1px solid var(--line);background:#ffffff15;border-radius:10px;  
  padding:10px 18px;cursor:pointer;font-weight:700;color:#fff;
}  
.browse-title strong{font-size:18px;display:block}  
.browse-title small{color:var(--muted);font-size:11px}  

.section-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 14px}  
.section-head h2{font-size:18px;margin:0;font-weight:700}  
.section-head span{font-size:12px;color:var(--muted)}  

.grid{  
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;  
}  
.card{  
  text-align:left;border:1px solid var(--line);border-radius:var(--radius);  
  overflow:hidden;background:#131c2e;padding:0;cursor:pointer;  
  transition:transform .15s ease, border-color .15s ease;  
}  
.thumb{aspect-ratio:16/9;background:#060a12;position:relative;overflow:hidden}  
.thumb img{width:100%;height:100%;object-fit:cover;display:block}  
.card-body{padding:12px 14px}  
.card-title{  
  font-size:14px;font-weight:700;line-height:1.35;  
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px  
}  
.card-meta{color:var(--muted);font-size:11px;margin-top:6px}  
.empty,.loading{color:var(--muted);padding:30px;text-align:center}  

/* TV FULLSCREEN PLAYER */  
.player-screen{  
  display:none;position:fixed;inset:0;width:100vw;height:100vh;  
  z-index:99999;background:#000;overflow:hidden;  
}  
.player-screen.open{display:block}  

.video-container{width:100vw;height:100vh;position:relative}  
#youtubePlayer{width:100%;height:100%;border:0;pointer-events:none}  

/* Floating UI Controls */  
.player-ui{  
  position:absolute;inset:0;z-index:10;  
  display:flex;flex-direction:column;justify-content:space-between;  
  padding:24px 36px;pointer-events:none;  
  transition:opacity .3s ease;  
}  
.player-screen.hide-ui .player-ui{opacity:0}  

.player-header{  
  display:flex;align-items:center;justify-content:space-between;  
  background:linear-gradient(180deg,rgba(0,0,0,0.85) 0%,transparent 100%);  
  margin:-24px -36px 0;padding:24px 36px;pointer-events:auto;  
}  
.close-btn,.player-control{  
  border:1px solid rgba(255,255,255,0.3);background:rgba(20,28,45,0.85);  
  border-radius:12px;padding:12px 22px;cursor:pointer;color:#fff;font-weight:700;font-size:14px;  
}  
.player-footer{  
  display:flex;flex-direction:column;align-items:center;gap:12px;  
  background:linear-gradient(0deg,rgba(0,0,0,0.85) 0%,transparent 100%);  
  margin:0 -36px -24px;padding:16px 36px 24px;pointer-events:auto;  
}  
.player-controls{display:flex;gap:16px}  
.player-status{color:var(--muted);font-size:13px}  
</style>  
</head>  
<body>  

<main class="app" id="home">    
  <header class="topbar">  
    <div class="brand">  
      <div class="logo">  
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 5.5v15M8 7h8M8 11h8"/></svg>  
      </div>  
      <div>  
        <div class="brand-name">Educational TV</div>  
        <div class="brand-sub">Classroom Learning</div>  
      </div>  
    </div>  
    <button class="refresh" id="refreshBtn" type="button">↻ Refresh Library</button>  
  </header>    

  <section class="hero" id="hero">  
    <div class="eyebrow">Smart Board & TV Portal</div>  
    <h1>Learning Playlists</h1>  
  </section>    

  <div class="browse-bar" id="browseBar">  
    <button class="back-library" id="backToPlaylists" type="button">← Back to Playlists</button>  
    <div class="browse-title">  
      <strong id="browsePlaylistTitle">Playlist</strong>  
      <small>Select video</small>  
    </div>  
  </div>    

  <div class="section-head">  
    <h2 id="sectionTitle">Playlists</h2>  
    <span id="itemCount"></span>  
  </div>    

  <section id="library" class="grid"></section>  
</main>  

<!-- Fullscreen TV Player Screen -->  
<section class="player-screen" id="playerScreen">  
  <div class="video-container">  
    <div id="youtubePlayer"></div>  
  </div>  

  <div class="player-ui" id="playerUi">  
    <div class="player-header">  
      <div>  
        <strong id="playingTitle" style="font-size:18px;display:block">Now Playing</strong>  
        <small id="playingSubtitle" style="color:var(--muted)">Educational TV</small>  
      </div>  
      <button class="close-btn" id="closePlayer" type="button">✕ Back to Videos</button>  
    </div>  

    <div class="player-footer">  
      <div class="player-status" id="playerStatus"></div>  
      <div class="player-controls">  
        <button class="player-control" id="prevBtn" type="button">◀ Previous</button>  
        <button class="player-control" id="pauseBtn" type="button">Ⅱ Pause</button>  
        <button class="player-control" id="nextBtn" type="button">Next ▶</button>  
      </div>  
    </div>  
  </div>  
</section>  

<script>  
(() => {  
"use strict";  
  
const PLAYLISTS_URL = "https://kumarbijoy143.github.io/EducationalApp/playlists.txt";  
const library = document.getElementById("library");  
const playerScreen = document.getElementById("playerScreen");  
const playingTitle = document.getElementById("playingTitle");  
const playingSubtitle = document.getElementById("playingSubtitle");  
const playerStatus = document.getElementById("playerStatus");  
  
let ytPlayer = null;  
let playerReady = false;  
let playlistEntries = [];  
let currentPlaylist = null;  
let currentVideos = [];  
let currentVideoIndex = 0;  
let currentView = "playlists"; // "playlists" | "videos" | "player"  
let selectedGridIndex = 0;  
let playerFocusedIndex = 0; // 0: Close, 1: Prev, 2: Pause, 3: Next  
let uiHideTimer = null;  

function getPlayerButtons() {  
  return [  
    document.getElementById("closePlayer"),  
    document.getElementById("prevBtn"),  
    document.getElementById("pauseBtn"),  
    document.getElementById("nextBtn")  
  ];  
}  
  
function getApiKey() {  
  try {  
    if (window.AndroidBridge && typeof window.AndroidBridge.getApiKey === "function") {  
      return String(window.AndroidBridge.getApiKey() || "");  
    }  
  } catch (e) {}  
  return "";  
}  
  
async function loadLibrary() {  
  library.innerHTML = `<div class="loading">Loading playlists…</div>`;  
  try {  
    const res = await fetch(PLAYLISTS_URL + "?v=" + Date.now(), { cache: "no-store" });  
    const text = await res.text();  
    playlistEntries = [];  
    text.split(/\r?\n/).forEach(line => {  
      const trimmed = line.trim();  
      if (!trimmed || trimmed.startsWith("#")) return;  
      const parts = trimmed.split("|");  
      const title = parts.length > 1 ? parts[0].trim() : "Playlist";  
      const rawUrl = parts.length > 1 ? parts.slice(1).join("|").trim() : trimmed;  
      const u = new URL(rawUrl.includes("http") ? rawUrl : "https://youtube.com/playlist?list=" + rawUrl);  
      const listId = u.searchParams.get("list") || rawUrl;  
      if (listId) playlistEntries.push({ title, playlistId: listId });  
    });  
    renderPlaylists();  
  } catch (e) {  
    library.innerHTML = `<div class="empty">Failed to load playlists.txt</div>`;  
  }  
}  
  
function renderPlaylists() {  
  currentView = "playlists";  
  document.getElementById("hero").style.display = "";  
  document.getElementById("browseBar").classList.remove("visible");  
  document.getElementById("sectionTitle").textContent = "Playlists";  
  document.getElementById("itemCount").textContent = `${playlistEntries.length} playlists`;  
  
  library.innerHTML = "";  
  playlistEntries.forEach((p, idx) => {  
    const card = document.createElement("button");  
    card.className = "card";  
    card.innerHTML = `  
      <div class="thumb"><img src="https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" alt=""></div>  
      <div class="card-body"><div class="card-title">${p.title}</div><div class="card-meta">Click to open</div></div>  
    `;  
    card.onclick = () => openPlaylist(p);  
    library.appendChild(card);  
  });  
  focusGridCard(0);  
}  
  
async function openPlaylist(p) {  
  currentPlaylist = p;  
  currentView = "videos";  
  document.getElementById("hero").style.display = "none";  
  document.getElementById("browseBar").classList.add("visible");  
  document.getElementById("browsePlaylistTitle").textContent = p.title;  
  document.getElementById("sectionTitle").textContent = "Videos";  
  library.innerHTML = `<div class="loading">Loading videos…</div>`;  
  
  const apiKey = getApiKey();  
  const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${encodeURIComponent(p.playlistId)}&key=${apiKey}`);  
  const data = await res.json();  
  currentVideos = (data.items || []).map(i => ({  
    videoId: i.snippet?.resourceId?.videoId || i.contentDetails?.videoId,  
    title: i.snippet?.title || "Video",  
    thumb: i.snippet?.thumbnails?.medium?.url || ""  
  })).filter(v => v.videoId);  
  
  library.innerHTML = "";  
  document.getElementById("itemCount").textContent = `${currentVideos.length} videos`;  
  currentVideos.forEach((v, idx) => {  
    const card = document.createElement("button");  
    card.className = "card";  
    card.innerHTML = `  
      <div class="thumb"><img src="${v.thumb}" alt=""></div>  
      <div class="card-body"><div class="card-title">${v.title}</div><div class="card-meta">Video ${idx+1}</div></div>  
    `;  
    card.onclick = () => playVideo(idx);  
    library.appendChild(card);  
  });  
  focusGridCard(0);  
}  
  
function playVideo(index) {  
  currentVideoIndex = index;  
  currentView = "player";  
  const vid = currentVideos[index];  
  playingTitle.textContent = vid.title;  
  playingSubtitle.textContent = `${currentPlaylist.title} · Video ${index + 1} of ${currentVideos.length}`;  
  playerScreen.classList.add("open");  
  wakePlayerUi();  
  
  if (!ytPlayer) {  
    const s = document.createElement("script");  
    s.src = "https://www.youtube.com/iframe_api";  
    window.onYouTubeIframeAPIReady = () => {  
      ytPlayer = new YT.Player("youtubePlayer", {  
        host: "https://www.youtube-nocookie.com",  
        playerVars: { autoplay:1, controls:0, rel:0, fs:0, modestbranding:1, iv_load_policy:3 },  
        events: {  
          onReady: () => {  
            playerReady = true;  
            ytPlayer.loadVideoById(vid.videoId);  
          },  
          onStateChange: e => {  
            if (e.data === 0 && currentVideoIndex < currentVideos.length - 1) {  
              playVideo(currentVideoIndex + 1);  
            }  
          }  
        }  
      });  
    };  
    document.head.appendChild(s);  
  } else if (playerReady) {  
    ytPlayer.loadVideoById(vid.videoId);  
  }  
  focusPlayerBtn(2); // Focus Pause/Play by default  
}  
  
function focusGridCard(idx) {  
  const cards = library.querySelectorAll(".card");  
  if (!cards.length) return;  
  selectedGridIndex = Math.max(0, Math.min(idx, cards.length - 1));  
  cards.forEach((c, i) => c.classList.toggle("focused", i === selectedGridIndex));  
  cards[selectedGridIndex].focus({ preventScroll: true });  
  cards[selectedGridIndex].scrollIntoView({ block: "nearest" });  
}  
  
function focusPlayerBtn(idx) {  
  const btns = getPlayerButtons();  
  playerFocusedIndex = (idx + btns.length) % btns.length;  
  btns.forEach((b, i) => b.classList.toggle("tv-focused", i === playerFocusedIndex));  
  btns[playerFocusedIndex].focus({ preventScroll: true });  
}  
  
function wakePlayerUi() {  
  playerScreen.classList.remove("hide-ui");  
  clearTimeout(uiHideTimer);  
  uiHideTimer = setTimeout(() => {  
    if (currentView === "player") playerScreen.classList.add("hide-ui");  
  }, 4500);  
}  

function closePlayerScreen() {  
  if (ytPlayer && playerReady) ytPlayer.pauseVideo();  
  playerScreen.classList.remove("open");  
  currentView = "videos";  
  focusGridCard(currentVideoIndex);  
}  

// Global Bridge Handlers called from Android dispatchKeyEvent
window.handleTvBackPress = function() {  
  if (currentView === "player") {  
    closePlayerScreen();  
    return "handled";  
  }  
  if (currentView === "videos") {  
    renderPlaylists();  
    return "handled";  
  }  
  return "exit"; // Tells Android to finish Activity  
};  

window.handleTvDpad = function(keyCode) {  
  wakePlayerUi();  
  
  if (currentView === "player") {  
    if (keyCode === 21) focusPlayerBtn(playerFocusedIndex - 1); // LEFT  
    if (keyCode === 22) focusPlayerBtn(playerFocusedIndex + 1); // RIGHT  
    if (keyCode === 19) focusPlayerBtn(0);                     // UP -> Close Btn  
    if (keyCode === 20) focusPlayerBtn(2);                     // DOWN -> Play/Pause  
    if (keyCode === 23 || keyCode === 66) {                    // CENTER / ENTER  
      getPlayerButtons()[playerFocusedIndex].click();  
    }  
    return;  
  }  

  const cols = 4;  
  if (keyCode === 21) focusGridCard(selectedGridIndex - 1);     // LEFT  
  if (keyCode === 22) focusGridCard(selectedGridIndex + 1);     // RIGHT  
  if (keyCode === 19) focusGridCard(selectedGridIndex - cols);  // UP  
  if (keyCode === 20) focusGridCard(selectedGridIndex + cols);  // DOWN  
  if (keyCode === 23 || keyCode === 66) {                       // ENTER  
    const cards = library.querySelectorAll(".card");  
    if (cards[selectedGridIndex]) cards[selectedGridIndex].click();  
  }  
};  

document.getElementById("closePlayer").onclick = closePlayerScreen;  
document.getElementById("backToPlaylists").onclick = renderPlaylists;  
document.getElementById("prevBtn").onclick = () => { if (currentVideoIndex > 0) playVideo(currentVideoIndex - 1); };  
document.getElementById("nextBtn").onclick = () => { if (currentVideoIndex < currentVideos.length - 1) playVideo(currentVideoIndex + 1); };  
document.getElementById("pauseBtn").onclick = () => {  
  if (!ytPlayer || !playerReady) return;  
  const state = ytPlayer.getPlayerState();  
  if (state === 1) { ytPlayer.pauseVideo(); document.getElementById("pauseBtn").textContent = "▶ Play"; }  
  else { ytPlayer.playVideo(); document.getElementById("pauseBtn").textContent = "Ⅱ Pause"; }  
};  
document.getElementById("refreshBtn").onclick = loadLibrary;  

window.onload = loadLibrary;  
})();  
</script>  
</body>  
</html>
